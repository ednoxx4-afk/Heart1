<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rainbow Heart</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


// =====================================
// COLORS FROM THE ORIGINAL PYTHON
// =====================================

const colors = [
    "red",
    "blue",
    "lime",
    "yellow",
    "cyan",
    "magenta",
    "orange",
    "violet"
];


// =====================================
// HEART EQUATION
// =====================================

function heart(angle) {

    const x =
        16 * Math.pow(Math.sin(angle), 3);

    const y =
        13 * Math.cos(angle)
        - 5 * Math.cos(2 * angle)
        - 2 * Math.cos(3 * angle)
        - Math.cos(4 * angle);

    return {
        x: x,
        y: y
    };
}


// =====================================
// DRAW STAR
// =====================================

function drawStar(x, y, color) {

    ctx.save();

    ctx.translate(x, y);

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.2;

    // 8-point sparkle
    for (let i = 0; i < 8; i++) {

        const angle =
            (Math.PI * 2 / 8) * i;

        ctx.beginPath();

        ctx.moveTo(
            Math.cos(angle) * 2,
            Math.sin(angle) * 2
        );

        ctx.lineTo(
            Math.cos(angle) * 6,
            Math.sin(angle) * 6
        );

        ctx.stroke();
    }

    // center dot
    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        1.8,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


// =====================================
// HEART ANIMATION
// =====================================

let i = 0;

const total = 120;


// Make the heart roughly the same size
// as the Python version

function drawNext() {

    if (i >= total) {
        return;
    }


    const angle =
        i * (Math.PI * 2 / total);


    const point =
        heart(angle);


    // Python screenshot uses:
    // t.goto(0, 40)

    const centerX =
        W / 2;

    const centerY =
        H / 2 + 40;


    // Scale the mathematical heart
    const scale =
        Math.min(W, H) * 0.022;


    const x =
        centerX +
        point.x * scale;


    // Canvas Y is opposite to Turtle's Y
    const y =
        centerY -
        point.y * scale;


    const color =
        colors[
            i % colors.length
        ];


    // =================================
    // DRAW RAY
    // =================================

    ctx.strokeStyle = color;
    ctx.lineWidth = 1;


    ctx.beginPath();

    ctx.moveTo(
        centerX,
        centerY
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.stroke();


    // =================================
    // DRAW SPARK
    // =================================

    drawStar(
        x,
        y,
        color
    );


    i++;


    // Slowly build the heart
    setTimeout(
        drawNext,
        45
    );
}


// =====================================
// START
// =====================================

drawNext();

</script>

</body>
</html>
